<svg xmlns='http://www.w3.org/2000/svg' width='1100' height='330' viewBox='0 0 1100 330'><defs><marker id='fl' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'><path d='M0,0 L10,4 L0,8 z' fill='#333'/></marker></defs><rect width='1100' height='330' fill='white'/><text x='550' y='20' font-family='Segoe UI,Arial,Helvetica,sans-serif' font-size='16' fill='#222' text-anchor='middle' dominant-baseline='middle' font-weight='bold'>Resultado de la partición: 4 buses de lectura y 2 de escritura</text><rect x='30' y='50' width='185' height='120' rx='12' fill='white' stroke='#7b3fbf' stroke-width='3'/><text x='122' y='70' font-family='Segoe UI,Arial,Helvetica,sans-serif' font-size='14' fill='#7b3fbf' text-anchor='middle' dominant-baseline='middle' font-weight='bold'>Bus A</text><text x='122' y='100' font-family='Segoe UI,Arial,Helvetica,sans-serif' font-size='12.5' fill='#222' text-anchor='middle' dominant-baseline='middle'>R2: B, L</text><text x='122' y='124' font-family='Segoe UI,Arial,Helvetica,sans-serif' font-size='12.5' fill='#222' text-anchor='middle' dominant-baseline='middle'>R6: G</text><rect x='230' y='50' width='185' height='120' rx='12' fill='white' stroke='#2f855a' stroke-width='3'/><text x='322' y='70' font-family='Segoe UI,Arial,Helvetica,sans-serif' font-size='14' fill='#2f855a' text-anchor='middle' dominant-baseline='middle' font-weight='bold'>Bus B</text><text x='322' y='100' font-family='Segoe UI,Arial,Helvetica,sans-serif' font-size='12.5' fill='#222' text-anchor='middle' dominant-baseline='middle'>R3: C, I</text><rect x='430' y='50' width='185' height='120' rx='12' fill='white' stroke='#2b6cb0' stroke-width='3'/><text x='522' y='70' font-family='Segoe UI,Arial,Helvetica,sans-serif' font-size='14' fill='#2b6cb0' text-anchor='middle' dominant-baseline='middle' font-weight='bold'>Bus C</text><text x='522' y='100' font-family='Segoe UI,Arial,Helvetica,sans-serif' font-size='12.5' fill='#222' text-anchor='middle' dominant-baseline='middle'>R1: A, E, H, N</text><text x='522' y='124' font-family='Segoe UI,Arial,Helvetica,sans-serif' font-size='12.5' fill='#222' text-anchor='middle' dominant-baseline='middle'>R4: D, F, J</text><rect x='630' y='50' width='185' height='120' rx='12' fill='white' stroke='#dd6b20' stroke-width='3'/><text x='722' y='70' font-family='Segoe UI,Arial,Helvetica,sans-serif' font-size='14' fill='#dd6b20' text-anchor='middle' dominant-baseline='middle' font-weight='bold'>Bus D</text><text x='722' y='100' font-family='Segoe UI,Arial,Helvetica,sans-serif' font-size='12.5' fill='#222' text-anchor='middle' dominant-baseline='middle'>R5: M</text><text x='722' y='124' font-family='Segoe UI,Arial,Helvetica,sans-serif' font-size='12.5' fill='#222' text-anchor='middle' dominant-baseline='middle'>'1': K</text><rect x='830' y='50' width='240' height='110' rx='12' fill='white' stroke='#b7791f' stroke-width='3'/><text x='950' y='70' font-family='Segoe UI,Arial,Helvetica,sans-serif' font-size='14' fill='#b7791f' text-anchor='middle' dominant-baseline='middle' font-weight='bold'>Bus W1</text><text x='950' y='100' font-family='Segoe UI,Arial,Helvetica,sans-serif' font-size='12.5' fill='#222' text-anchor='middle' dominant-baseline='middle'>MUL: Q, R, U, W</text><rect x='830' y='180' width='240' height='110' rx='12' fill='white' stroke='#c53030' stroke-width='3'/><text x='950' y='200' font-family='Segoe UI,Arial,Helvetica,sans-serif' font-size='14' fill='#c53030' text-anchor='middle' dominant-baseline='middle' font-weight='bold'>Bus W2</text><text x='950' y='230' font-family='Segoe UI,Arial,Helvetica,sans-serif' font-size='12.5' fill='#222' text-anchor='middle' dominant-baseline='middle'>ADD: O, T, V</text><text x='950' y='254' font-family='Segoe UI,Arial,Helvetica,sans-serif' font-size='12.5' fill='#222' text-anchor='middle' dominant-baseline='middle'>SH: P, Y</text><text x='420' y='200' font-family='Segoe UI,Arial,Helvetica,sans-serif' font-size='13' fill='#222' text-anchor='middle' dominant-baseline='middle' font-weight='bold'>Entradas de cada unidad (MUX):</text><text x='60' y='225' font-family='Segoe UI,Arial,Helvetica,sans-serif' font-size='12.5' fill='#222' text-anchor='start' dominant-baseline='middle'>× izq (ML) &lt;- Bus A, B, C   -&gt; MUX 3:1</text><text x='60' y='245' font-family='Segoe UI,Arial,Helvetica,sans-serif' font-size='12.5' fill='#222' text-anchor='start' dominant-baseline='middle'>× der (MR) &lt;- Bus C, A      -&gt; MUX 2:1</text><text x='60' y='265' font-family='Segoe UI,Arial,Helvetica,sans-serif' font-size='12.5' fill='#222' text-anchor='start' dominant-baseline='middle'>+ izq (AL) &lt;- Bus C, B      -&gt; MUX 2:1</text><text x='60' y='285' font-family='Segoe UI,Arial,Helvetica,sans-serif' font-size='12.5' fill='#222' text-anchor='start' dominant-baseline='middle'>+ der (AR) &lt;- Bus D, A      -&gt; MUX 2:1</text><text x='60' y='305' font-family='Segoe UI,Arial,Helvetica,sans-serif' font-size='12.5' fill='#222' text-anchor='start' dominant-baseline='middle'>&gt;&gt;1 (SH)   &lt;- Bus C         -&gt; directo</text><text x='500' y='225' font-family='Segoe UI,Arial,Helvetica,sans-serif' font-size='12.5' fill='#555' text-anchor='start' dominant-baseline='middle'>Sin buses: 4 + 3 + 3 + 3 + 1 = 14 entradas de MUX</text><text x='500' y='247' font-family='Segoe UI,Arial,Helvetica,sans-serif' font-size='12.5' fill='#2f855a' text-anchor='start' dominant-baseline='middle' font-weight='bold'>Con buses: 3 + 2 + 2 + 2 + 1 = 10 entradas de MUX</text></svg>